name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish podcast-guest-crm-cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm 11 (Trusted Publishing needs 11.5.1 or newer)
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter podcast-guest-crm-cli run lint

      - name: Type check
        run: pnpm --filter podcast-guest-crm-cli run typecheck

      - name: Run tests
        run: pnpm --filter podcast-guest-crm-cli run test
        env:
          NODE_ENV: test

      - name: Build
        run: pnpm --filter podcast-guest-crm-cli run build

      - name: Publish to npm
        working-directory: packages/cli
        run: npm publish --access public
